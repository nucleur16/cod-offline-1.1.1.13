name: Shared UI baseline
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: native_check_01
        continue-on-error: true
        run: python tests/test_ui_baseline.py
      - id: native_check_02
        continue-on-error: true
        run: python tests/test_quick_ready_gate.py
      - id: native_check_03
        continue-on-error: true
        run: python tests/test_quick_host_real_name.py
      - id: native_check_04
        continue-on-error: true
        run: python tests/test_room_display_owner.py
      - id: native_check_05
        continue-on-error: true
        run: python -B tests/test_tip_stage_lookup.py
      - id: native_check_06
        continue-on-error: true
        run: python -B tests/test_invitations_disabled.py
      - id: native_check_07
        continue-on-error: true
        run: python -B tests/test_invitations_current_transition.py
      - id: native_check_08
        continue-on-error: true
        run: python -B tests/test_zone_packs.py
      - id: native_check_09
        continue-on-error: true
        run: python -B -m unittest discover -s tests -p "test_zone_pack_*.py"
      - id: native_check_10
        continue-on-error: true
        run: gcc -O2 -Wall -Wextra -Werror tests/quick_start_policy_test.c -o /tmp/quick-start-policy && /tmp/quick-start-policy && gcc -O2 -Wall -Wextra -Werror tests/controller_glyph_policy_test.c -o /tmp/controller-glyph-policy && /tmp/controller-glyph-policy
      - id: native_check_11
        continue-on-error: true
        run: python -B docs/baselines/20261024-gfx-date-time/run_regressions.py --output-dir /tmp/gfx-date-time
      - id: native_check_12
        continue-on-error: true
        run: gcc -Wall -Wextra -Werror tests/patch_locale_test.c -o /tmp/locale-selection && /tmp/locale-selection
      - id: native_check_13
        continue-on-error: true
        run: python -B tests/test_optionview_method.py
      - id: native_check_14
        continue-on-error: true
        run: python -B tests/test_kernel_cutover_contract.py
      - id: native_check_15
        continue-on-error: true
        run: python -B tests/test_quiet_diagnostic_paths.py
      - id: native_check_16
        continue-on-error: true
        run: python -I -S -B tests/test_r46_native_source_integration.py
      - id: native_check_17
        continue-on-error: true
        run: gcc -std=c99 -O2 -Wall -Wextra -Werror tests/test_guest_binding_wire.c p2p_startup_wire.c p2p_guest_binding_wire.c -o /tmp/guest-binding-wire && /tmp/guest-binding-wire && python -I -S -B tests/test_p2p_inproc_lifecycle.py
      - id: native_check_18
        continue-on-error: true
        run: python -I -S -B tests/test_playlist_active_ordinal_selector.py
      - id: native_check_19
        continue-on-error: true
        run: gcc -std=c99 -O2 -Wall -Wextra -Werror tests/p2p_activation_transaction_test.c -o /tmp/p2p-activation-transaction && /tmp/p2p-activation-transaction
      - id: native_check_20
        continue-on-error: true
        run: gcc -std=c99 -O2 -Wall -Wextra -Werror tests/locale_switch_policy_test.c -o /tmp/locale-switch-policy && /tmp/locale-switch-policy
      - name: Require every native source check to succeed
        if: ${{ !cancelled() }}
        env:
          NATIVE_QUALIFICATION_STEPS: ${{ toJSON(steps) }}
        run: |
          python - <<'PY'
          import json, os
          expected = ['native_check_01', 'native_check_02', 'native_check_03', 'native_check_04', 'native_check_05', 'native_check_06', 'native_check_07', 'native_check_08', 'native_check_09', 'native_check_10', 'native_check_11', 'native_check_12', 'native_check_13', 'native_check_14', 'native_check_15', 'native_check_16', 'native_check_17', 'native_check_18', 'native_check_19', 'native_check_20']
          steps = json.loads(os.environ['NATIVE_QUALIFICATION_STEPS'])
          bad = []
          for key in expected:
              outcome = steps.get(key, {}).get('outcome', 'missing')
              print(key + ': ' + outcome)
              if outcome != 'success':
                  bad.append(key)
          if bad:
              raise SystemExit('Native qualification failed or did not run: ' + ', '.join(bad))
          print('All 20 native source check commands passed.')
          PY
