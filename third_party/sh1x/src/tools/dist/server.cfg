// sh1x server - Call of Duty Online Closed Alpha Server configuration
// Executed at every start (START-SH1X-SERVER.cmd / start-sh1x-server.sh).
// The UDP port is set in the launcher (SH1X_PORT), not here.

set sv_hostname "sh1x server"
// Player slots are fixed at start: SH1X_MAXCLIENTS in the launcher (default 18).

// RCON. The lobby starts matches over RCON from the same host, so give it this
// exact password: CODOL_MATCH_RCON_PASSWORD, or native_server_rcon.txt in its
// state directory. Generated when this distribution was built; change freely.
set rcon_password "__RCON_PASSWORD__"

// ---- link to the lobby (Demonware emulator), which runs separately ----------
// The lobby must run on this same host: it hands the server each player's
// session key and admission through files, and RCON is accepted from loopback
// only. Point these at the lobby's state directory (its CODOL_STATE_DIR; the
// Docker compose deployment calls it ./data) and its resources directory.
set securityKeyPath "lobby_state/securitykey.bin"
set admissionPath "lobby_state/game_admissions.txt"
set profilePath "lobby_state/resources"

// 1 = only players the lobby admitted may join, under their lobby account and
// gamertag. 0 = also accept the last key in securitykey.bin (local testing).
set admissionRequired 1

// ---- bots ----------------------------------------------------------------
// Fill around the real players: no bots while the server is empty, otherwise
// scr_botfill minus the number of real players, at most scr_botmax.
// (scr_botfill 0 = a fixed scr_bots count instead.) Maps without a
// waypoint graph get no bots regardless.
set scr_botfill 12
set scr_botmax 11
set scr_bots 0

// ---- map rotation (mp) --------------------------------------------------
// When a match ends the scoreboard shows, then the server loads the next
// map/mode of this list and everyone stays connected. After the last entry it
// starts over. exitToLobby 1 would instead send everyone back to the lobby
// at match end. sv_randomMapRotation 1 plays the list in a shuffled order.
// A player who readies up in the lobby while the server is empty still picks
// the map; the rotation takes over from the end of that match.
set exitToLobby 0
set sv_randomMapRotation 0
set sv_mapRotation "gametype war map mp_rust map mp_bog_sh map mp_crash_tropical map mp_afghan gametype dom map mp_underpass map mp_estate_tropical gametype war map mp_cargoship_sh map mp_bloc_sh map mp_fav_tropical gametype dm map mp_killhouse_sh gametype war map mp_overgrown map mp_storm_spring gametype dom map mp_cross_fire gametype war map mp_nuked"

// ---- map rotation (zombies / coop) ---------------------------------------
// A zombies or coop match never rotates into the mp list above. At a zombies
// game over the server loads the next map of sv_mapRotation_zm (C1's own
// Zombies playlist rotates exactly these two maps); a coop match replays its
// mission unless sv_mapRotation_coop lists others. An empty list replays the
// current map.
set sv_mapRotation_zm "gametype zm map zm_prototype_sh map zm_asylum_sh"
set sv_mapRotation_coop ""

// ---- boot map ------------------------------------------------------------
// What the server loads at start. The lobby switches maps over RCON when a match
// starts on an empty server, so this only matters until then. An instance the
// lobby starts itself boots straight into its match instead (SH1X_MAP).
set g_gametype "dm"
set sv_zoneType "mp"
set sv_sessionMap "mp_rust"
set sh1x_boot "map mp_rust"
